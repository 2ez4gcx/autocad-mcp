name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Windows: install_autocad_bridge tests use %APPDATA%-style paths. The .NET bridge needs the AutoCAD assemblies,
    # which a runner does not have: SKIP_BRIDGE=1 builds and tests the server only (the release is built locally).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcpb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcpb/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SKIP_BRIDGE: '1'
      - run: node scripts/unit-test.mjs
